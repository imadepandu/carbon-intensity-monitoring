<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="Forecast Sentinel">
  <rect width="1200" height="420" fill="#F6F4EE"/>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#111111">
    <text x="62" y="92" font-size="52" letter-spacing="2">Forecast Sentinel</text>
    <text x="64" y="122" font-size="12" letter-spacing="6" fill="#333333">FORECAST ERROR MONITORING</text>
    <text x="64" y="152" font-size="15" fill="#333333">Memantau galat ramalan intensitas karbon listrik Britania Raya.</text>
    <path d="M64 172H102" stroke="#111111" stroke-width="1.5"/>

    <text x="860" y="76" font-size="12" letter-spacing="5" fill="#333333">CONCEPT</text>
    <text x="860" y="104" font-size="13" fill="#333333">•  Galat = actual − forecast</text>
    <text x="860" y="128" font-size="13" fill="#333333">•  EWMA memantau pergeseran</text>
    <text x="860" y="152" font-size="13" fill="#333333">•  CEP mendeteksi pola kejadian</text>
  </g>

  <rect x="62" y="196" width="1076" height="196" rx="20" fill="#EDE9DF" stroke="#111111" stroke-width="3"/>
  <rect x="86" y="262" width="1028" height="70" fill="#BEB8AD" fill-opacity=".35"/>
  <path d="M86 262H1114M86 332H1114" stroke="#777777" stroke-width="1" stroke-dasharray="5 5"/>

  <path d="M86 301 C170 284 230 322 320 301 S470 278 560 303 S700 325 790 301 S950 284 1114 296"
