  <circle cx="878" cy="262" r="6" fill="#111111"/>
  <circle cx="878" cy="262" r="16" fill="none" stroke="#111111" stroke-width="1.5"/>
  <text x="852" y="250" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" letter-spacing="3" fill="#111111">ALERT</text>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" letter-spacing="3" fill="#333333">
    <path d="M90 224H114" stroke="#777777" stroke-width="2.5" stroke-dasharray="5 4"/>
    <text x="124" y="228">FORECAST</text>
